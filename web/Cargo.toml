[package]
name = "luauxtx-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
luauxtx = { path = ".." }
mlua = { version = "0.12.1", features = ["luau", "vendored"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Event", "EventTarget", "HtmlElement", "Storage", "console"] }

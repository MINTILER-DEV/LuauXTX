<!doctype html>
<html><body>
  <button id="button">click me</button><pre id="output"></pre>
  <script type="module">
    import init, { run, set_text } from "./pkg/luauxtx_web.js";
    await init();
    document.querySelector("#output").textContent = run(`
      local document = require("web/document")
      local button = document:get("#button")
      button:on("click", function() button:setText("clicked") end)
      return "Luau browser bindings are live"
    `);
  </script>
</body></html>

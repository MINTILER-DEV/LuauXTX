[package]
name = "luauxtx"
version = "0.1.0"
edition = "2024"
description = "A small Luau runtime hosted by Rust"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
mlua = { version = "0.12.1", features = ["async", "luau", "vendored"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.20.0", features = ["v4"] }

[patch.crates-io]
mlua = { path = "vendor/mlua" }
